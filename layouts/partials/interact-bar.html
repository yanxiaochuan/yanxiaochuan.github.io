{{ $lyketId := .File.ContentBaseName | urlize }}
<div class="interact-bar">
  <div class="ib-left">
    <div data-lyket-type="like" data-lyket-id="{{ $lyketId }}" data-lyket-namespace="posts"></div>
    <span class="ib-views" id="ib-gc-views"></span>
  </div>
  <div class="ib-right">
    <!-- 复制链接 -->

    <!-- 微信 -->

    </button>
    <!-- 微博 -->
    <button class="ib-share-icon" onclick="ibWeibo()" title="分享到微博" style="background:#e6162d;color:#fff;">

    </button>
    <!-- 小红书 -->
    <button class="ib-share-icon" onclick="ibXhs()" title="分享到小红书" style="background:#fe2c55;color:#fff;">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm3.5 14.5h-7a.5.5 0 0 1-.5-.5V8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5zM9 8.5v7h6v-7H9zm2.5 2h1v3h-1v-3z"/></svg>
    </button>
  </div>
</div>
<div class="ib-toast" id="ib-toast"></div>
<div class="ib-wx-overlay" id="ibWxOverlay" onclick="if(event.target===this)ibCloseWx()">
  <div class="ib-wx-box">
    <p style="font-weight:600;margin:0 0 8px;">打开微信扫一扫，分享给好友</p>
    <img id="ib-wx-qr" src="" alt="二维码" width="200" height="200" />
    <p style="font-size:12px;color:#999;margin:8px 0 0;">或复制链接发送给好友</p>
    <button class="ib-wx-close" onclick="ibCloseWx()">关闭</button>
  </div>
</div>
<script>
(function(){
  var gc=setInterval(function(){
    if(window.goatcounter&&window.goatcounter.visit_count){
      clearInterval(gc);
      var el=document.getElementById('ib-gc-views');
      window.goatcounter.visit_count({append:'#ib-gc-views',type:'html',no_branding:true});
      setTimeout(function(){
        if(el){var t=el.innerText.replace(/[^0-9]/g,'')||'0';el.innerHTML='👁 '+t+' 次浏览';}
      },2000);
    }
  },200);
  setTimeout(function(){clearInterval(gc);},10000);

  window.ibShowToast=function(msg){
    var t=document.getElementById('ib-toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2000);
  };

  window.ibCopy=function(){
    var url=location.href;
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){ibShowToast('链接已复制！');});
    }else{
      var a=document.createElement('textarea');a.value=url;
      document.body.appendChild(a);a.select();document.execCommand('copy');
      document.body.removeChild(a);ibShowToast('链接已复制！');
    }
  };

  window.ibWechat=function(){
    var url=encodeURIComponent(location.href);
    document.getElementById('ib-wx-qr').src=
      'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+url;
    document.getElementById('ibWxOverlay').classList.add('show');
  };
  window.ibCloseWx=function(){
    document.getElementById('ibWxOverlay').classList.remove('show');
  };

  window.ibWeibo=function(){
    var u=encodeURIComponent(location.href);
    var t=encodeURIComponent(document.title);
    window.open('https://service.weibo.com/share/share.php?url='+u+'&title='+t,'_blank','width=600,height=500');
  };

  window.ibXhs=function(){
    var text=document.title+' '+location.href;
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        ibShowToast('已复制标题和链接，请打开小红书粘贴分享');
      });
    }else{ibShowToast('请手动复制链接分享到小红书');}
  };
})();
</script>
